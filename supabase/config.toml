# LingoPure — Supabase project config (pushed to managed project via `supabase config push`).
# Target project: LingoPure Sandbox (uovbwccvxgdghqvlpuql) — the live project the app uses.
# NOTE: site_url must be updated in the Supabase dashboard too (CLI `config push` cannot
# set auth.site_url on managed projects — it's dashboard-only).

project_id = "uovbwccvxgdghqvlpuql"

[auth]
# Production URL — used as the base for confirmation / magic-link / password-reset
# emails. localhost stays in additional_redirect_urls so dev signup still works.
site_url = "https://purelingo-app-sandbox.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "https://purelingo-app-sandbox.vercel.app",
  "https://purelingo-app-sandbox.vercel.app/**",
  "https://*.vercel.app/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@lingopure.com"
sender_name = "LingoPure"
