# LingoPure — Supabase project config (pushed to managed project via `supabase config push`).
# Target project: TBD — new LingoPure-owned project (Phase 4). NOT `htycbbjbhokaztvtwvdo`
# (that project belongs to LingoPure/purelingo-app, an unreachable repo — out of scope).
# Replace this project_id with the new LingoPure project ref once created.

project_id = "lingopure-tbd"

[auth]
# Production URL — used as the base for confirmation / magic-link / password-reset
# emails. localhost stays in additional_redirect_urls so dev signup still works.
site_url = "https://lingo-pure-ai.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "https://lingo-pure-ai.vercel.app",
  "https://lingo-pure-ai.vercel.app/**",
  "https://*.vercel.app/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@lingopure.com"
sender_name = "LingoPure"
